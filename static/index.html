<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWASP Juice Shop</title>
  <meta name="description" content="An intentionally delightful, fresh organic juice and smoothie e-commerce store with dummy checkout.">
  <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg">
  <!-- Styles -->
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <!-- Top Navigation Bar (Matches Screenshot) -->
  <header class="navbar">
    <div class="nav-left">
      <button class="nav-toggle-btn" id="nav-drawer-toggle" title="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a href="/" class="brand-link">
        <img src="/static/images/logo.svg" alt="OWASP Juice Shop Logo" class="brand-logo">
        <span class="brand-title">OWASP Juice Shop</span>
      </a>
    </div>

    <div class="nav-right">
      <!-- Search Bar -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="nav-search-input" class="search-input" placeholder="Search Kashmiri apple, Alphonso, Tulsi..." autocomplete="off">
        </div>
      </div>

      <!-- Account Menu Dropdown -->
      <div class="dropdown" id="account-dropdown-container">
        <button class="nav-btn" id="account-dropdown-btn">
          <span>👤</span>
          <span id="account-btn-label">Account</span>
          <span style="font-size: 0.7rem; margin-left: 2px;">▼</span>
        </button>
        <div class="dropdown-menu" id="account-dropdown-menu">
          <!-- Populated by app.js -->
        </div>
      </div>

      <!-- Basket Button with Badge -->
      <button class="nav-btn" id="nav-basket-btn" onclick="openBasketModal()" title="View Basket">
        <span>🛒</span>
        <span>Your Basket</span>
        <span class="nav-badge" id="nav-basket-badge">0</span>
      </button>

      <!-- Language & Currency Selector (India) -->
      <div class="nav-btn lang-selector" title="Region & Currency">
        <span>🇮🇳</span>
        <span>IN (₹)</span>
      </div>

    </div>
  </header>

  <!-- Side Navigation Drawer -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="side-drawer">
    <div class="drawer-header">
      <img src="/static/images/logo.svg" width="32" height="32" alt="Logo">
      <span style="font-weight: 700; color: #fff;">OWASP Juice Shop</span>
    </div>
    <nav class="drawer-nav">
      <a href="/" class="drawer-link active">
        <span>🍹</span> All Products
      </a>
      <a href="javascript:void(0)" class="drawer-link" onclick="openBasketModal(); document.getElementById('drawer-overlay').click();">
        <span>🛒</span> Shopping Basket
      </a>
      <a href="javascript:void(0)" class="drawer-link" onclick="openOrdersModal(); document.getElementById('drawer-overlay').click();">
        <span>📦</span> Order History & Receipts
      </a>
      <a href="/login" class="drawer-link">
        <span>🔑</span> Login / Register
      </a>
      <div class="dropdown-divider" style="margin: 0.75rem 1.5rem;"></div>
      <a href="javascript:void(0)" class="drawer-link" onclick="showToast('Customer Feedback is open! Leave reviews on any juice.', 'info'); document.getElementById('drawer-overlay').click();">
        <span>💬</span> Customer Feedback
      </a>
      <a href="javascript:void(0)" class="drawer-link" onclick="showToast('Fresh organic ingredients pressed daily at 4°C.', 'info'); document.getElementById('drawer-overlay').click();">
        <span>ℹ️</span> About Us
      </a>
    </nav>
  </aside>

  <!-- Subheader Banner ("All Products") -->
  <section class="subheader-banner">
    <div class="banner-title-area">
      <h1 class="banner-title">All Products</h1>
      <span class="banner-count" id="products-count-badge">Loading...</span>
    </div>
    <div class="banner-controls">
      <select id="category-filter-select" class="category-filter" title="Filter by Category">
        <option value="All">All Categories</option>
      </select>
      <select id="sort-by-select" class="sort-select" title="Sort Products">
        <option value="default">Default Sorting</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating">Top Rated</option>
        <option value="name">Name (A-Z)</option>
      </select>
    </div>
  </section>

  <!-- Main Product Catalog Grid -->
  <main class="main-content">
    <div class="products-grid" id="products-grid">
      <!-- Populated dynamically by app.js -->
    </div>
  </main>

  <!-- Modal: Product Details & Reviews -->
  <div class="modal-backdrop" id="product-modal-backdrop">
    <div class="modal-box" id="product-modal-content">
      <!-- Populated dynamically -->
    </div>
  </div>

  <!-- Modal: Shopping Basket -->
  <div class="modal-backdrop" id="basket-modal-backdrop">
    <div class="modal-box" id="basket-modal-content">
      <!-- Populated dynamically -->
    </div>
  </div>

  <!-- Modal: Multi-Step Dummy Payment Portal -->
  <div class="modal-backdrop" id="checkout-modal-backdrop">
    <div class="modal-box" id="checkout-modal-content" style="max-width: 580px;">
      <!-- Populated dynamically -->
    </div>
  </div>

  <!-- Generic Modal (Orders / Profile) -->
  <div class="modal-backdrop" id="generic-modal-backdrop">
    <div class="modal-box" id="generic-modal-content">
      <!-- Populated dynamically -->
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="/static/js/app.js"></script>
</body>
</html>
