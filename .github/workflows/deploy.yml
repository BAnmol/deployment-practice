# Save this file in your repo at: .github/workflows/deploy.yml
#
# What it does on every push to main:
#   1. Builds the Docker image from your Dockerfile
#   2. Pushes it to GitHub Container Registry (ghcr.io) — free, no ACR needed
#   3. (Optional job) Tells Azure Container Apps to pull the new image
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   AZURE_CREDENTIALS   -> JSON output of `az ad sp create-for-rbac ...` (see guide, Step 6)
#   (GITHUB_TOKEN is automatic — nothing to add for the GHCR push)

name: Build and deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}   # must be lowercase — see note in guide
  RESOURCE_GROUP: rg-juiceshop-free
  CONTAINER_APP: juiceshop-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name and tag
        id: meta
        run: |
          echo "image=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  deploy:
    # Delete this whole job if you prefer to run `az containerapp update` manually
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App image
        run: |
          IMAGE=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):${{ needs.build-and-push.outputs.image_tag }}
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"
