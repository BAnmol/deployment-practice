version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: juice_shop_chromadb
    ports:
      - "8002:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    volumes:
      - ./chroma_data:/chroma/chroma
    restart: unless-stopped
